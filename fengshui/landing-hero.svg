<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bedroom plan on an Eight Mansions compass, eight directions color-coded from gold (best) to dark red (least suitable)</title>
<style>
.r1{fill:#F7CF4A;stroke:#fbf7ef;stroke-width:3} .r2{fill:#F2A93B;stroke:#fbf7ef;stroke-width:3} .r3{fill:#EA8130;stroke:#fbf7ef;stroke-width:3} .r4{fill:#DC5A24;stroke:#fbf7ef;stroke-width:3} .r5{fill:#B8261E;stroke:#fbf7ef;stroke-width:3} .r6{fill:#8C1A1E;stroke:#fbf7ef;stroke-width:3} .r7{fill:#5E1418;stroke:#fbf7ef;stroke-width:3} .r8{fill:#2B0C0E;stroke:#fbf7ef;stroke-width:3} .lt{fill:#fff}
.lbl{font:600 17px Georgia,serif;fill:#3b2f1e;text-anchor:middle} .tri{font:22px serif;fill:#8a6d3b;text-anchor:middle}
.wall{fill:#fffdf8;stroke:#3b2f1e;stroke-width:6} .thin{fill:none;stroke:#3b2f1e;stroke-width:2}
.bed{fill:#f6efe2;stroke:#3b2f1e;stroke-width:2.5} .quilt{fill:#8a6d3b;opacity:.85} .pillow{fill:#fffdf8;stroke:#3b2f1e;stroke-width:2}
.win{stroke:#5d8fa8;stroke-width:7} .gap{stroke:#fffdf8;stroke-width:8} .rug{fill:#e8dcc6} .plant{fill:#2f6b55}
.ns{stroke:#8a6d3b;stroke-width:1.5;stroke-dasharray:4 6}
.lbl.lt,.tri.lt{fill:#fff;stroke:#2b0c0e;stroke-width:3px;paint-order:stroke;stroke-linejoin:round} .tri{fill:#3b2f1e;opacity:.7}
</style>
<polygon class="r8" points="166.6,34.6 353.4,34.6 328.1,95.5 191.9,95.5"/>
<text class="lbl lt" x="260.0" y="45.0">N</text>
<text class="tri lt" x="260.0" y="73.0">☵</text>
